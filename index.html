    <!-- Inject dynamic text-along-path plugin logic directly -->
    <script>
    L.Polyline.include({
        setText: function (text, options) {
            options = options || {};
            if (!text) {
                if (this._textNode && this._textNode.parentNode) {
                    this._textNode.parentNode.removeChild(this._textNode);
                }
                return this;
            }
            var defaults = {
                center: true,
                below: false,
                offset: 0,
                orientation: 0,
                attributes: {}
            };
            for (var i in defaults) { if (options[i] === undefined) { options[i] = defaults[i]; } }
            
            this._text = text;
            this._textOptions = options;
            
            this.on('add', this._setText, this);
            this.on('remove', this._clearText, this);
            
            if (this._map) { this._setText(); }
            return this;
        },
        _clearText: function () {
            if (this._textNode && this._textNode.parentNode) {
                this._textNode.parentNode.removeChild(this._textNode);
            }
        },
        _setText: function () {
            if (!this._renderer || !this._renderer._container) return;
            var path = this._path;
            if (!path) return;
            
            var id = 'path-' + L.Util.stamp(this);
            path.setAttribute('id', id);
            
            var svg = this._map._renderer._container;
            if (svg.tagName !== 'svg') {
                svg = svg.querySelector('svg');
            }
            if (!svg) return;
            
            var defs = svg.querySelector('defs');
            if (!defs) {
                defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                svg.insertBefore(defs, svg.firstChild);
            }
            
            this._clearText();
            
            var textNode = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            var textPath = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
            
            textPath.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + id);
            if (this._textOptions.center) {
                textPath.setAttribute('startOffset', '50%');
                textNode.setAttribute('text-anchor', 'middle');
            }
            
            textPath.textContent = this._text;
            textNode.appendChild(textPath);
            
            for (var attr in this._textOptions.attributes) {
                textNode.setAttribute(attr, this._textOptions.attributes[attr]);
            }
            
            if (this._textOptions.offset !== 0) {
                textNode.setAttribute('dy', this._textOptions.offset);
            }
            
            svg.appendChild(textNode);
            this._textNode = textNode;
        }
    });
    </script>
